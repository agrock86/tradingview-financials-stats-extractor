[project]
name = "financials-stats-extractor"
version = "0.0.1"
authors = [{ name = "Ricardo Patiño", email = "twinsensor@hotmail.com" }]
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "selenium>=4.44.0",
    "beautifulsoup4>=4.14.3",
    "pandas>=2.3.3"
]

[tool.poetry]
requires-poetry = ">=2.1.0"
packages = [
    { include = "financials_stats_extractor" },
]

[tool.black]
line-length = 125

[tool.poetry.dependencies]
python = ">=3.10,<3.13"

[tool.poetry.group.test.dependencies]
pytest = "^8.4.2"

[tool.poetry.group.build.dependencies]
pre-commit = "^4.5.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
